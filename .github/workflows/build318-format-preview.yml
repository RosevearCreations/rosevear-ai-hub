name: Build 318 Temporary Ruff Format Preview
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  preview-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.17.4
      - name: Print formatted Build 318 files for reviewed correction
        shell: bash
        run: |
          ruff format server/src/rosevear_ai_hub/master_shell_acceptance318.py server/tests/test_master_shell_acceptance318.py
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ('server/src/rosevear_ai_hub/master_shell_acceptance318.py', 'server/tests/test_master_shell_acceptance318.py'):
              print('BUILD318_FORMAT_BEGIN:' + name)
              print(base64.b64encode(Path(name).read_bytes()).decode())
              print('BUILD318_FORMAT_END:' + name)
          PY
