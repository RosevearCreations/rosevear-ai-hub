name: Build 321 Temporary Ruff Format Preview
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  formatter-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.4
      - name: Print exact Ruff-formatted Build 321 Python files
        shell: bash
        run: |
          ruff format server/src/rosevear_ai_hub/master_shell_acceptance321.py server/tests/test_master_shell_acceptance321.py
          python - <<'PY'
          import base64
          from pathlib import Path
          for path in ("server/src/rosevear_ai_hub/master_shell_acceptance321.py",
                       "server/tests/test_master_shell_acceptance321.py"):
              print("BUILD321_FORMAT_BEGIN:" + path)
              print(base64.b64encode(Path(path).read_bytes()).decode())
              print("BUILD321_FORMAT_END:" + path)
          PY
