name: Foundation, Backend, Web and Desktop Checks

on:
  push:
    # A reviewed PR already runs the full five-gate suite for dev. Keep the
    # independent production/main push verification; omit the duplicate dev push.
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR heads may be canceled. Never cancel a main push witness.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical documentation exists
        shell: bash
        run: |
          test -f README.md
          test -f docs/SOURCE_OF_TRUTH.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BUILD_ROADMAP.md
          test -f docs/SECURITY_MODEL.md
          test -f docs/DATA_MODEL.md
          test -f docs/INTEGRATIONS.md
          test -f docs/TESTING_AND_RELEASE.md
          test -f docs/OPERATIONS.md
          test -f docs/DECISIONS_TO_MAKE.md
          test -f docs/BUILD_STATUS.md
          test -f docs/WINDOWS_SUPERVISED_RESTART_2026.md
          test -f docs/BUILD_240_SUPERVISED_WINDOWS_RESTART_FIELD_EVIDENCE.md
          test -f docs/DESKTOP_RUNTIME.md
          test -f docs/OLLAMA_SETUP.md
      - name: QL-252 public source-proof publication must remain fail-closed without original witness authorization
        run: node scripts/ql252-hub-publication-guard.mjs
      - name: QL-252 publication and public provenance synthetic contract regressions
        run: node scripts/ql252-hub-publication-guard.test.mjs && node scripts/ql252-hub-public-check.test.mjs
      - name: QL-253 offline public-provenance and private relay HOLD regressions
        run: node scripts/ql253-hub-provenance-readiness.test.mjs
      - name: QL-254 synthetic private relay rollback and source registry HOLD regressions
        run: node scripts/ql254-hub-provenance-relay.test.mjs
      - name: QL-338 signed read-only device origin, encrypted offline queue and relay OFF regressions
        run: node scripts/ql338-private-relay.test.mjs
      - name: QL-339A disabled Windows agent registration, local-only probe and rollback tests
        run: node --test scripts/ql339a-relay-agent.test.mjs scripts/ql339a-relay-task.test.mjs
      - name: QL-339B owner-encrypted device signer and signed TEST packet HOLD regressions
        run: node --test scripts/ql339b-windows-signer.test.mjs
      - name: QL-256 real source-CI and redacted signer-custody readiness regressions
        run: npm run integration:ql256:hub:test
      - name: QL-256 witness public signature candidate cryptography and fail-closed regressions
        run: npm run integration:ql256:witness:test
      - name: QL-257 six-app owner status and expiring witness challenge fail-closed regressions
        run: npm run integration:ql257:hub:test
      - name: QL-258 public current-source proof refresh and fail-closed regressions
        run: npm run integration:ql258:hub:test
      - name: QL-261 exact owner return packet and private proof HOLD regressions
        run: npm run integration:ql261:hub:test
      - name: Build 188 original owner packet and public A-to-B ancestry fail-closed regressions
        run: npm run integration:ql261:hub:188:test
      - name: Build 189 QL-262 original receipt, witness freshness and proof B rejection regressions
        run: npm run integration:ql262:hub:test
      - name: Build 190 QL-263 public reviewer origin and immutable proof-B recheck fail-closed regressions
        run: npm run integration:ql263:hub:test
      - name: Build 191 QL-264 private-role public decision, proof-B and reversible TEST-only HOLD regressions
        run: npm run integration:ql264:hub:test
      - name: Build 252 CI gate preservation regression
        run: node scripts/ci-foundation-contract.test.mjs
      - name: Build 254 promotion event and budget contract regressions
        run: node scripts/ci-run-budget-254.test.mjs
      - name: Build 255 historical SLA and Windows HOLD handoff regressions
        run: node scripts/ci-trend-255.test.mjs
      - name: Build 256 signed Windows process evidence and receiver-HOLD contract
        run: node scripts/build-256-contract.test.mjs
      - name: Build 257 case-insensitive recovery and independent receiver-OFF source contract
        run: node scripts/build-257-contract.test.mjs
      - name: Build 258 privilege-aware Windows identity and signed TEST HOLD contract
        run: node scripts/build-258-contract.test.mjs
      - name: Build 259 original Windows launcher and independent offline TEST witness HOLD contract
        run: node scripts/build-259-contract.test.mjs
      - name: Build 260 supervised Windows release and independent runtime TEST HOLD contract
        run: node scripts/build-260-contract.test.mjs
      - name: Build 261 original issuer installed-source and supervised restart TEST HOLD contract
        run: node scripts/build-261-contract.test.mjs
      - name: Build 262 Dark Mode contrast, client source and read-only runtime HOLD contract
        run: node scripts/build-262-contract.test.mjs
      - name: Build 263 original Windows launcher, distinct signed restart candidate and Comms TEST HOLD contract
        run: node scripts/build-263-contract.test.mjs
      - name: Build 264 original Windows runtime authority, witnessed decision and scoped Comms TEST HOLD contract
        run: node scripts/build-264-contract.test.mjs
      - name: Build 265 original private Comms GET, shutdown and independent owner receipt HOLD contract
        run: node scripts/build-265-contract.test.mjs
      - name: Build 266 original private receiver audit, nonce replay closure and owner-governed candidate HOLD contract
        run: node scripts/build-266-contract.test.mjs
      - name: Build 267 original source-of-truth, independent owner trust and read-only trial HOLD contract
        run: node scripts/build-267-contract.test.mjs
      - name: Build 268 original private receiver authenticated readback, independent trial grant and one-GET HOLD contract
        run: node scripts/build-268-contract.test.mjs
      - name: QL-365D original local-support source manifest and private one-GET HOLD attachment
        run: node --test scripts/ql365d-source-attachment.test.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check server/src server/tests scripts/hub_release_manager.py scripts/hub_private_backup.py scripts/hub_release_assurance.py server/src/rosevear_ai_hub/release_observability.py server/src/rosevear_ai_hub/release_health_cohorts.py server/src/rosevear_ai_hub/release_incident_triage.py
      - name: Format check
        run: ruff format --check server/src server/tests scripts/hub_release_manager.py scripts/hub_private_backup.py scripts/hub_release_assurance.py server/src/rosevear_ai_hub/release_observability.py server/src/rosevear_ai_hub/release_health_cohorts.py server/src/rosevear_ai_hub/release_incident_triage.py
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install --include=optional
      - name: Verify Rollup Linux native dependency
        shell: bash
        run: |
          # npm sometimes omits an optional platform-specific Rollup package,
          # especially on cached hosted runners. npm install --no-save from a
          # workspace can leave the native package missing after a second pass.
          # Extract the exact installed Rollup version into THIS CI checkout.
          if ! node -e "require('rollup')"; then
            version=$(node -p "require('rollup/package.json').version")
            tarball=$(npm pack "@rollup/rollup-linux-x64-gnu@$version" --pack-destination "$RUNNER_TEMP" --silent)
            target="$GITHUB_WORKSPACE/node_modules/@rollup/rollup-linux-x64-gnu"
            mkdir -p "$target"
            tar -xzf "$RUNNER_TEMP/$tarball" -C "$target" --strip-components=1
            node -e "require('rollup')"
          fi
      - name: Type check
        run: npm run typecheck
      # All historical and current web specs are discovered by Vitest in one run.
      # Do not rerun selected specs first: that duplicated expensive jsdom work
      # and multiplied runner queue time without adding coverage.
      - name: Full web regression suite (all builds, single execution)
        run: npm run test -- --maxWorkers=1
      - name: Production build
        run: npm run build

  backup-windows:
    # Run actual backup operations on Windows. Desktop Rust compilation alone
    # cannot catch locked SQLite handles and TemporaryDirectory WinError 32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Windows encrypted backup and isolated recovery tests
        run: python -m pytest server/tests/test_backup_restore.py server/tests/test_disaster_recovery.py server/tests/test_production_readiness.py server/tests/test_release_manager.py server/tests/test_release_assurance.py server/tests/test_release_observability.py server/tests/test_release_health_cohorts.py server/tests/test_release_incident_triage.py
      - name: Windows end-to-end synthetic recovery smoke drill
        run: python -m rosevear_ai_hub.disaster_recovery synthetic --work-dir "${{ runner.temp }}"

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: QL-339A Windows Node agent and disabled task safety tests
        run: node --test scripts/ql339a-relay-agent.test.mjs scripts/ql339a-relay-task.test.mjs
      - name: QL-339B Windows signing CLI safety tests
        run: node --test scripts/ql339b-windows-signer.test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install Node workspaces
        run: npm install
      - name: Validate Windows recovery PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          $releaseAlertTokens = $null
          $releaseAlertErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Send-Hub-Release-Alert.ps1'), [ref]$releaseAlertTokens, [ref]$releaseAlertErrors) | Out-Null
          foreach ($parseError in @($releaseAlertErrors)) { $allErrors += $parseError.ToString() }
          foreach ($file in @('scripts/hub-recovery.ps1', 'scripts/hub-recovery-mode.ps1', 'scripts/test-hub-recovery-mode.ps1', 'scripts/install-hub-recovery-task.ps1', 'scripts/install-hub-startup-task.ps1', 'scripts/enable-tailscale-serve.ps1', 'scripts/configure-lan-https.ps1', 'scripts/check-production-readiness.ps1', 'scripts/update-rosevear-ai-hub.ps1', 'scripts/restart-hub-backend.ps1', 'scripts/update-hub-backend.ps1', 'scripts/hub-backend-identity.ps1', 'scripts/test-hub-backend-identity.ps1', 'scripts/hub-release-policy.ps1', 'scripts/test-hub-release-policy.ps1', 'scripts/hub-auto-update.ps1', 'scripts/install-hub-auto-update.ps1', 'scripts/restart-hub-web.ps1', 'scripts/inspect-hub-lan.ps1', 'scripts/inspect-hub-release-tasks.ps1', 'scripts/inspect-hub-process-248.ps1', 'scripts/inspect-hub-process-249.ps1', 'scripts/inspect-hub-artifact-251.ps1', 'scripts/inspect-hub-mapping-253.ps1', 'scripts/inspect-ql338-hub-readiness.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              $allErrors += "$file : $($parseError.ToString())"
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify Build 077 supervised bootstrap recovery routing
        shell: pwsh
        run: ./scripts/test-hub-recovery-mode.ps1
      - name: Verify accepted and rejected Hub Python process identities
        shell: pwsh
        run: ./scripts/test-hub-backend-identity.ps1
      - name: Verify Build 060 release eligibility and Vite process ownership
        shell: pwsh
        run: ./scripts/test-hub-release-policy.ps1
      - name: Prevent reserved PowerShell HOME assignment in Tailscale preflight
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/enable-tailscale-serve.ps1' -Raw
          if ($source -match '(?im)^\s*\$HOME\s*=') {
            throw 'Tailscale preflight may not assign to PowerShell automatic variable HOME.'
          }
      - name: Guard opt-in LAN HTTPS setup and firewall scoping
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/configure-lan-https.ps1' -Raw
          foreach ($needle in @('admin off', 'tls internal', 'remote_ip', 'bind $LanIPv4', 'Get-NetConnectionProfile', 'New-NetFirewallRule', 'RemoteAddress = $TrustedLanCIDRs', '127.0.0.1:8765', 'if (-not $Enable)', 'if ($Disable)')) {
            if (-not $source.Contains($needle)) { throw "Missing private LAN guard: $needle" }
          }
          if ($source -match '(?im)^\s*\$HOME\s*=' -or $source.Contains('tailscale funnel')) { throw 'Unsafe LAN script change' }
      - name: Ensure Build 078 LAN diagnostics remain read-only and Vite loopback-only
        shell: pwsh
        run: |
          $lan = Get-Content -LiteralPath 'scripts/inspect-hub-lan.ps1' -Raw
          $vite = Get-Content -LiteralPath 'apps/web/vite.config.ts' -Raw
          $recovery = Get-Content -LiteralPath 'scripts/hub-recovery.ps1' -Raw
          foreach ($forbidden in @('New-NetFirewallRule', 'Start-Process', 'Stop-Process', 'Set-NetFirewallRule', 'Register-ScheduledTask')) {
            if ($lan.Contains($forbidden)) { throw "LAN inspector must not mutate state: $forbidden" }
          }
          if (-not $vite.Contains('host: "127.0.0.1"')) { throw 'Vite must stay loopback only.' }
          if (-not $recovery.Contains('--host 127.0.0.1')) { throw 'Recovery preview must stay loopback only.' }
      - name: Validate Build 079 read-only acceptance inspector
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-acceptance.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -gt 0) { throw ($parseErrors -join '; ') }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($required in @('Get-NetFirewallAddressFilter', 'Get-NetTCPConnection', 'MANUAL_REVIEW', 'changed_anything = $false')) {
            if (-not $source.Contains($required)) { throw "Build 079 missing acceptance guard: $required" }
          }
          foreach ($forbidden in @('New-NetFirewallRule', 'Set-NetFirewallAddressFilter', 'Remove-NetFirewallRule', 'Start-Process', 'Stop-Process', 'Register-ScheduledTask', 'Unregister-ScheduledTask')) {
            if ($source.Contains($forbidden)) { throw "Build 079 inspector must be read only: $forbidden" }
          }
      - name: Guard Build 253 mapping inspector against host mutations and raw data export
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/inspect-hub-mapping-253.ps1' -Raw
          foreach ($required in @('on_device_read_only', 'witness_verified = $false', 'process_attested = $false', 'changes_made = $false', 'inspect-hub-artifact-251.ps1', 'inspect-hub-process-249.ps1')) {
            if (-not $source.Contains($required)) { throw "Missing Build 253 trust guard: $required" }
          }
          foreach ($forbidden in @('Start-Process ', 'Stop-Process ', 'Register-ScheduledTask ', 'Set-ScheduledTask ', 'Unregister-ScheduledTask ', 'Invoke-RestMethod ', 'Invoke-WebRequest ', 'Start-VM ', 'Stop-VM ', 'Set-Content ', 'Out-File ')) {
            if ($source -match "(?m)^\s*[^#\r\n]*\b$([regex]::Escape($forbidden.Trim()))\b") { throw "Build 253 inspector cannot mutate host: $forbidden" }
          }
      - name: Parse Build 255 Windows evidence handoff and enforce read-only contract
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-release-255.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($required in @('DISCONNECTED / HOLD', 'installed_release_attested = $false', 'changed_anything = $false', '--probe-local', '--inspect')) {
            if (-not $source.Contains($required)) { throw "Missing Build 255 evidence HOLD guard: $required" }
          }
          foreach ($forbidden in @('Start-Process', 'Stop-Process', 'Register-ScheduledTask', 'Start-ScheduledTask', '--send-once', '--enroll')) {
            if ($source.Contains($forbidden)) { throw "Unsafe Build 255 handoff: $forbidden" }
          }
      - name: Parse Build 256 Windows process observer and preserve immutable HOLD flags
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-process-256.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-256-contract.test.mjs
      - name: Parse Build 257 Windows process-chain observer and protect scheduled-task state
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-chain-257.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-257-contract.test.mjs
      - name: Parse and smoke-test Build 258 privilege-aware Windows observer
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-identity-258.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-258-contract.test.mjs
          $observed = & (Resolve-Path $file).Path | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-installed-identity-258/v1' -or
              $observed.changed_anything -ne $false -or $observed.remote_requests -ne 0 -or
              $observed.process_attested -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 258 Windows observer breached its read-only HOLD contract'
          }
      - name: Parse and smoke-test Build 259 original Windows launcher custody observer
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-launcher-259.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-259-contract.test.mjs
          $observed = & (Resolve-Path $file).Path | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-launcher-custody-259/v1' -or
              $observed.changed_anything -ne $false -or $observed.remote_requests -ne 0 -or
              $observed.restart_authorized -ne $false -or $observed.challenge_executed -ne $false -or
              $observed.test_authorized -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 259 Windows launcher observer breached read-only TEST HOLD contract'
          }
      - name: Parse and smoke-test Build 260 supervised release runtime observer
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-runtime-260.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-260-contract.test.mjs
          $observed = & (Resolve-Path $file).Path | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-supervised-runtime-260/v1' -or
              $observed.stage -ne 'before' -or $observed.operator_stage_is_not_proof -ne $true -or
              $observed.changed_anything -ne $false -or $observed.remote_requests -ne 0 -or
              $observed.supervised_restart_authorized -ne $false -or
              $observed.supervised_restart_performed_attested -ne $false -or
              $observed.test_authorized -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 260 Windows read-only runtime observer breached supervised TEST HOLD contract'
          }
      - name: Parse and smoke-test Build 261 Windows original launcher template and source map
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-installed-261.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-261-contract.test.mjs
          $observed = & (Resolve-Path $file).Path | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-installed-source-map-261/v1' -or
              $observed.stage -ne 'before' -or
              $observed.artifact_mapping_status -ne 'checkout_artifacts_only' -or
              $observed.changed_anything -ne $false -or $observed.remote_requests -ne 0 -or
              $observed.original_installed_source_verified -ne $false -or
              $observed.supervised_restart_receipt_verified -ne $false -or
              $observed.independent_witness_verified -ne $false -or
              $observed.test_authorized -ne $false -or $observed.challenge_executed -ne $false -or
              $observed.receiver_activated -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 261 Windows observer breached original custody or receiver-OFF contract'
          }
      - name: Parse and smoke-test Build 262 Windows runtime closure without altering recovery
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-closure-262.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-262-contract.test.mjs
          $observed = & (Resolve-Path $file).Path | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-runtime-closure-262/v1' -or
              $observed.stage -ne 'before' -or $observed.changed_anything -ne $false -or
              $observed.remote_requests -ne 0 -or
              $observed.recovery_success_is_process_proof -ne $false -or
              $observed.original_installed_source_verified -ne $false -or
              $observed.supervised_restart_receipt_verified -ne $false -or
              $observed.test_authorized -ne $false -or $observed.challenge_executed -ne $false -or
              $observed.receiver_activated -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 262 Windows source/receiver gate must remain read-only HOLD'
          }
      - name: Parse and smoke-test Build 263 Windows original launcher with no restart or Comms authorization
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-launcher-263.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-263-contract.test.mjs
          $observed = & (Resolve-Path $file).Path | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-original-launcher-custody-263/v1' -or
              $observed.stage -ne 'before' -or $observed.changed_anything -ne $false -or
              $observed.remote_requests -ne 0 -or
              $observed.original_launcher_custody_attested -ne $false -or
              $observed.supervised_restart_attested -ne $false -or
              $observed.independently_signed_runtime_accepted -ne $false -or
              $observed.test_authorized -ne $false -or
              $observed.challenge_executed -ne $false -or
              $observed.receiver_activated -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 263 original Windows evidence must remain read-only and receiver OFF'
          }
      - name: Parse and smoke-test Build 264 Windows original authority readback with Comms receiver OFF
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-authority-264.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          node scripts/build-264-contract.test.mjs
          $observed = & (Resolve-Path $file).Path -Stage before | ConvertFrom-Json
          if ($observed.schema -ne 'rosevear-windows-authority-field-264/v1' -or
              $observed.stage -ne 'before' -or $observed.changed_anything -ne $false -or
              $observed.remote_requests -ne 0 -or
              $observed.launcher_263.source -ne 'on_device_read_only' -or
              $observed.original_host_authenticated -ne $false -or
              $observed.witnessed_restart_accepted -ne $false -or
              $observed.test_authorized -ne $false -or
              $observed.challenge_executed -ne $false -or
              $observed.receiver_activated -ne $false -or $observed.comms_connected -ne $false) {
            throw 'Build 264 original Windows authority field readback must stay HOLD and read-only'
          }
      - name: Validate Build 080 private LAN recovery guards
        shell: pwsh
        run: ./scripts/test-hub-lan-recovery.ps1
      - name: Build 081 read-only deferred reboot evidence regression
        shell: pwsh
        run: ./scripts/test-hub-reboot-readiness.ps1
      - name: Validate Build 082 identity diagnostics
        shell: pwsh
        run: ./scripts/test-hub-gateway-082.ps1
      - name: Build 104 supervised restart task readiness regression
        shell: pwsh
        run: ./scripts/test-hub-startup-readiness.ps1
      - name: Build 105 schema hold and dependency-ordered gateway recovery regression
        shell: pwsh
        run: ./scripts/test-hub-build-105.ps1
      - name: Build 106 read-only HA VM and MQTT dependency acceptance regression
        shell: pwsh
        run: ./scripts/test-hub-build-106.ps1
      - name: Build 146 Windows task classification is syntactically valid and strictly read-only
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-startup-console.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($required in @('Get-ScheduledTask', 'Get-ScheduledTaskInfo', 'Get-CimInstance', 'rosevear-hub-windows-startup-v1')) {
            if (-not $source.Contains($required)) { throw "Build 146 missing inspector source: $required" }
          }
          foreach ($forbidden in @('Start-Process', 'Stop-Process', 'Start-ScheduledTask', 'Register-ScheduledTask', 'Set-ScheduledTask', 'Unregister-ScheduledTask', 'Start-VM', 'Stop-VM', 'Invoke-RestMethod', 'Invoke-WebRequest')) {
            if ($source -match "(?m)^\s*[^#\r\n]*\b$([regex]::Escape($forbidden))\b") { throw "Build 146 inspector must not mutate state: $forbidden" }
          }
      - name: Check Rust shell
        run: npm run desktop:check
      - name: Build Windows desktop executable
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: rosevear-ai-hub-windows
          path: apps/desktop/src-tauri/target/release/rosevear-ai-hub.exe
          if-no-files-found: error

  ci-budget:
    # One lightweight in-run summary after all five protected checks. No new
    # workflow_run event or external coordinator; failures stay fail-closed.
    if: ${{ always() }}
    needs: [docs-foundation, backend, web, backup-windows, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify gate equivalence and publish run budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CI_QUEUE_BUDGET_SECONDS: "300"
          CI_WALL_BUDGET_SECONDS: "900"
        run: node scripts/ci-run-budget-254.mjs
      - name: Build 255 post-consolidation queue and runtime trend readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-trend-255.mjs
