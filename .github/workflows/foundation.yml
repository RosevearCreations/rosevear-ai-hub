name: Foundation and Backend Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  docs-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical documentation exists
        shell: bash
        run: |
          test -f README.md
          test -f docs/SOURCE_OF_TRUTH.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BUILD_ROADMAP.md
          test -f docs/SECURITY_MODEL.md
          test -f docs/DATA_MODEL.md
          test -f docs/INTEGRATIONS.md
          test -f docs/TESTING_AND_RELEASE.md
          test -f docs/OPERATIONS.md
          test -f docs/DECISIONS_TO_MAKE.md
          test -f docs/BUILD_STATUS.md

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check server/src server/tests
      - name: Format check
        run: ruff format --check server/src server/tests
      - name: Test
        run: pytest
