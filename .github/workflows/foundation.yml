name: Foundation, Backend, Web and Desktop Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical documentation exists
        shell: bash
        run: |
          test -f README.md
          test -f docs/SOURCE_OF_TRUTH.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BUILD_ROADMAP.md
          test -f docs/SECURITY_MODEL.md
          test -f docs/DATA_MODEL.md
          test -f docs/INTEGRATIONS.md
          test -f docs/TESTING_AND_RELEASE.md
          test -f docs/OPERATIONS.md
          test -f docs/DECISIONS_TO_MAKE.md
          test -f docs/BUILD_STATUS.md
          test -f docs/DESKTOP_RUNTIME.md
          test -f docs/OLLAMA_SETUP.md

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check server/src server/tests
      - name: Format check
        run: ruff format --check server/src server/tests
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install Node workspaces
        run: npm install
      - name: Validate Windows recovery PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('scripts/hub-recovery.ps1', 'scripts/install-hub-recovery-task.ps1', 'scripts/enable-tailscale-serve.ps1', 'scripts/configure-lan-https.ps1')) { [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null }
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Prevent reserved PowerShell HOME assignment in Tailscale preflight
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/enable-tailscale-serve.ps1' -Raw
          if ($source -match '(?im)^\s*\$HOME\s*=') {
            throw 'Tailscale preflight may not assign to PowerShell automatic variable HOME.'
          }
      - name: Guard opt-in LAN HTTPS setup and firewall scoping
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/configure-lan-https.ps1' -Raw
          foreach ($needle in @('admin off', 'tls internal', 'remote_ip', 'bind $LanIPv4', 'Get-NetConnectionProfile', 'New-NetFirewallRule', '-RemoteAddress $TrustedLanCIDRs', '127.0.0.1:8765', 'if (-not $Enable)', 'if ($Disable)')) {
            if (-not $source.Contains($needle)) { throw "Missing private LAN guard: $needle" }
          }
          if ($source -match '(?im)^\s*\$HOME\s*=' -or $source.Contains('tailscale funnel')) { throw 'Unsafe LAN script change' }
      - name: Check Rust shell
        run: npm run desktop:check
      - name: Build Windows desktop executable
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: rosevear-ai-hub-windows
          path: apps/desktop/src-tauri/target/release/rosevear-ai-hub.exe
          if-no-files-found: error
