name: Foundation, Backend, Web and Desktop Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical documentation exists
        shell: bash
        run: |
          test -f README.md
          test -f docs/SOURCE_OF_TRUTH.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BUILD_ROADMAP.md
          test -f docs/SECURITY_MODEL.md
          test -f docs/DATA_MODEL.md
          test -f docs/INTEGRATIONS.md
          test -f docs/TESTING_AND_RELEASE.md
          test -f docs/OPERATIONS.md
          test -f docs/DECISIONS_TO_MAKE.md
          test -f docs/BUILD_STATUS.md
          test -f docs/DESKTOP_RUNTIME.md
          test -f docs/OLLAMA_SETUP.md
      - name: QL-252 public source-proof publication must remain fail-closed without original witness authorization
        run: node scripts/ql252-hub-publication-guard.mjs
      - name: QL-252 publication and public provenance synthetic contract regressions
        run: node scripts/ql252-hub-publication-guard.test.mjs && node scripts/ql252-hub-public-check.test.mjs
      - name: QL-253 offline public-provenance and private relay HOLD regressions
        run: node scripts/ql253-hub-provenance-readiness.test.mjs
      - name: QL-254 synthetic private relay rollback and source registry HOLD regressions
        run: node scripts/ql254-hub-provenance-relay.test.mjs
      - name: QL-256 real source-CI and redacted signer-custody readiness regressions
        run: npm run integration:ql256:hub:test
      - name: QL-256 witness public signature candidate cryptography and fail-closed regressions
        run: npm run integration:ql256:witness:test
      - name: QL-257 six-app owner status and expiring witness challenge fail-closed regressions
        run: npm run integration:ql257:hub:test
      - name: QL-258 public current-source proof refresh and fail-closed regressions
        run: npm run integration:ql258:hub:test
      - name: QL-261 exact owner return packet and private proof HOLD regressions
        run: npm run integration:ql261:hub:test
      - name: Build 188 original owner packet and public A-to-B ancestry fail-closed regressions
        run: npm run integration:ql261:hub:188:test
      - name: Build 189 QL-262 original receipt, witness freshness and proof B rejection regressions
        run: npm run integration:ql262:hub:test
      - name: Build 190 QL-263 public reviewer origin and immutable proof-B recheck fail-closed regressions
        run: npm run integration:ql263:hub:test
      - name: Build 191 QL-264 private-role public decision, proof-B and reversible TEST-only HOLD regressions
        run: npm run integration:ql264:hub:test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check server/src server/tests scripts/hub_release_manager.py scripts/hub_private_backup.py scripts/hub_release_assurance.py server/src/rosevear_ai_hub/release_observability.py server/src/rosevear_ai_hub/release_health_cohorts.py server/src/rosevear_ai_hub/release_incident_triage.py
      - name: Format check
        run: ruff format --check server/src server/tests scripts/hub_release_manager.py scripts/hub_private_backup.py scripts/hub_release_assurance.py server/src/rosevear_ai_hub/release_observability.py server/src/rosevear_ai_hub/release_health_cohorts.py server/src/rosevear_ai_hub/release_incident_triage.py
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        run: npm install --include=optional
      - name: Verify Rollup Linux native dependency
        shell: bash
        run: |
          # npm sometimes omits an optional platform-specific Rollup package,
          # especially on cached hosted runners. Only repair this CI workspace.
          if ! node -e "require('rollup')"; then
            version=$(node -p "require('rollup/package.json').version")
            npm install --no-save --package-lock=false --ignore-scripts --include=optional "@rollup/rollup-linux-x64-gnu@$version"
            node -e "require('rollup')"
          fi
      - name: Type check
        run: npm run typecheck
      - name: Build 192 QL-267 local-only source status export and TEST-HOLD UI regressions
        run: npm run test -- ql267HubEvidence.test.ts CommsHubConnectionPanel.test.tsx
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build

  backup-windows:
    # Run actual backup operations on Windows. Desktop Rust compilation alone
    # cannot catch locked SQLite handles and TemporaryDirectory WinError 32.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Windows encrypted backup and isolated recovery tests
        run: python -m pytest server/tests/test_backup_restore.py server/tests/test_disaster_recovery.py server/tests/test_production_readiness.py server/tests/test_release_manager.py server/tests/test_release_assurance.py server/tests/test_release_observability.py server/tests/test_release_health_cohorts.py server/tests/test_release_incident_triage.py
      - name: Windows end-to-end synthetic recovery smoke drill
        run: python -m rosevear_ai_hub.disaster_recovery synthetic --work-dir "${{ runner.temp }}"

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install Node workspaces
        run: npm install
      - name: Validate Windows recovery PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          $releaseAlertTokens = $null
          $releaseAlertErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Send-Hub-Release-Alert.ps1'), [ref]$releaseAlertTokens, [ref]$releaseAlertErrors) | Out-Null
          foreach ($parseError in @($releaseAlertErrors)) { $allErrors += $parseError.ToString() }
          foreach ($file in @('scripts/hub-recovery.ps1', 'scripts/hub-recovery-mode.ps1', 'scripts/test-hub-recovery-mode.ps1', 'scripts/install-hub-recovery-task.ps1', 'scripts/install-hub-startup-task.ps1', 'scripts/enable-tailscale-serve.ps1', 'scripts/configure-lan-https.ps1', 'scripts/check-production-readiness.ps1', 'scripts/update-rosevear-ai-hub.ps1', 'scripts/restart-hub-backend.ps1', 'scripts/update-hub-backend.ps1', 'scripts/hub-backend-identity.ps1', 'scripts/test-hub-backend-identity.ps1', 'scripts/hub-release-policy.ps1', 'scripts/test-hub-release-policy.ps1', 'scripts/hub-auto-update.ps1', 'scripts/install-hub-auto-update.ps1', 'scripts/restart-hub-web.ps1', 'scripts/inspect-hub-lan.ps1', 'scripts/inspect-hub-release-tasks.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              $allErrors += "$file : $($parseError.ToString())"
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify Build 077 supervised bootstrap recovery routing
        shell: pwsh
        run: ./scripts/test-hub-recovery-mode.ps1
      - name: Verify accepted and rejected Hub Python process identities
        shell: pwsh
        run: ./scripts/test-hub-backend-identity.ps1
      - name: Verify Build 060 release eligibility and Vite process ownership
        shell: pwsh
        run: ./scripts/test-hub-release-policy.ps1
      - name: Prevent reserved PowerShell HOME assignment in Tailscale preflight
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/enable-tailscale-serve.ps1' -Raw
          if ($source -match '(?im)^\s*\$HOME\s*=') {
            throw 'Tailscale preflight may not assign to PowerShell automatic variable HOME.'
          }
      - name: Guard opt-in LAN HTTPS setup and firewall scoping
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'scripts/configure-lan-https.ps1' -Raw
          foreach ($needle in @('admin off', 'tls internal', 'remote_ip', 'bind $LanIPv4', 'Get-NetConnectionProfile', 'New-NetFirewallRule', 'RemoteAddress = $TrustedLanCIDRs', '127.0.0.1:8765', 'if (-not $Enable)', 'if ($Disable)')) {
            if (-not $source.Contains($needle)) { throw "Missing private LAN guard: $needle" }
          }
          if ($source -match '(?im)^\s*\$HOME\s*=' -or $source.Contains('tailscale funnel')) { throw 'Unsafe LAN script change' }
      - name: Ensure Build 078 LAN diagnostics remain read-only and Vite loopback-only
        shell: pwsh
        run: |
          $lan = Get-Content -LiteralPath 'scripts/inspect-hub-lan.ps1' -Raw
          $vite = Get-Content -LiteralPath 'apps/web/vite.config.ts' -Raw
          $recovery = Get-Content -LiteralPath 'scripts/hub-recovery.ps1' -Raw
          foreach ($forbidden in @('New-NetFirewallRule', 'Start-Process', 'Stop-Process', 'Set-NetFirewallRule', 'Register-ScheduledTask')) {
            if ($lan.Contains($forbidden)) { throw "LAN inspector must not mutate state: $forbidden" }
          }
          if (-not $vite.Contains('host: "127.0.0.1"')) { throw 'Vite must stay loopback only.' }
          if (-not $recovery.Contains('--host 127.0.0.1')) { throw 'Recovery preview must stay loopback only.' }
      - name: Validate Build 079 read-only acceptance inspector
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-acceptance.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -gt 0) { throw ($parseErrors -join '; ') }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($required in @('Get-NetFirewallAddressFilter', 'Get-NetTCPConnection', 'MANUAL_REVIEW', 'changed_anything = $false')) {
            if (-not $source.Contains($required)) { throw "Build 079 missing acceptance guard: $required" }
          }
          foreach ($forbidden in @('New-NetFirewallRule', 'Set-NetFirewallAddressFilter', 'Remove-NetFirewallRule', 'Start-Process', 'Stop-Process', 'Register-ScheduledTask', 'Unregister-ScheduledTask')) {
            if ($source.Contains($forbidden)) { throw "Build 079 inspector must be read only: $forbidden" }
          }
      - name: Validate Build 080 private LAN recovery guards
        shell: pwsh
        run: ./scripts/test-hub-lan-recovery.ps1
      - name: Build 081 read-only deferred reboot evidence regression
        shell: pwsh
        run: ./scripts/test-hub-reboot-readiness.ps1
      - name: Validate Build 082 identity diagnostics
        shell: pwsh
        run: ./scripts/test-hub-gateway-082.ps1
      - name: Build 104 supervised restart task readiness regression
        shell: pwsh
        run: ./scripts/test-hub-startup-readiness.ps1
      - name: Build 105 schema hold and dependency-ordered gateway recovery regression
        shell: pwsh
        run: ./scripts/test-hub-build-105.ps1
      - name: Build 106 read-only HA VM and MQTT dependency acceptance regression
        shell: pwsh
        run: ./scripts/test-hub-build-106.ps1
      - name: Build 146 Windows task classification is syntactically valid and strictly read-only
        shell: pwsh
        run: |
          $file = 'scripts/inspect-hub-startup-console.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors -join '; ') }
          $source = Get-Content -LiteralPath $file -Raw
          foreach ($required in @('Get-ScheduledTask', 'Get-ScheduledTaskInfo', 'Get-CimInstance', 'rosevear-hub-windows-startup-v1')) {
            if (-not $source.Contains($required)) { throw "Build 146 missing inspector source: $required" }
          }
          foreach ($forbidden in @('Start-Process', 'Stop-Process', 'Start-ScheduledTask', 'Register-ScheduledTask', 'Set-ScheduledTask', 'Unregister-ScheduledTask', 'Start-VM', 'Stop-VM', 'Invoke-RestMethod', 'Invoke-WebRequest')) {
            if ($source -match "(?m)^\s*[^#\r\n]*\b$([regex]::Escape($forbidden))\b") { throw "Build 146 inspector must not mutate state: $forbidden" }
          }
      - name: Check Rust shell
        run: npm run desktop:check
      - name: Build Windows desktop executable
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: rosevear-ai-hub-windows
          path: apps/desktop/src-tauri/target/release/rosevear-ai-hub.exe
          if-no-files-found: error
