[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosevear-ai-hub"
version = "0.0.36"
description = "Private local-first AI, home automation, knowledge, camera and business integration hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "paho-mqtt>=2.1,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["server/src"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
